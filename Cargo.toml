[package]
name = "mystream"
version = "0.1.0"
edition = "2024"
description = "MyStream natif : logiciel de streaming et d'enregistrement (BloopStudio)"
authors = ["BloopStudio"]

[[bin]]
name = "MyStream"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui_extras = "0.37.0"
env_logger = "0.11.11"
epaint = { version = "0.37", features = ["monochrome_emoji_fonts"] }
epaint_default_fonts = "0.37"
fontdue = "0.9.5"
global-hotkey = "0.10.0"
image = "0.25.10"
log = "0.4.35"
parking_lot = "0.13.0"
pollster = "1.0.1"
rfd = "0.18.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tungstenite = "0.30.0"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
wgpu = "30"
zip = { version = "*", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "*"
wasapi = "*"
windows = { version = "*", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(not(windows))'.dependencies]
xcap = "*"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
