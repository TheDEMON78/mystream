name: Build & Release

# Chaque push sur main produit une nouvelle version 1.Y.X :
#   N = nombre total de commits, X = N % 100, Y = N / 100 (division entière).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Calculer la version
        run: |
          N=$(git rev-list --count HEAD)
          Y=$((N / 100))
          X=$((N % 100))
          echo "version=1.${Y}.${X}" >> "$GITHUB_OUTPUT"
          echo "Version : 1.${Y}.${X} ($N commits)"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pkg set version=${{ needs.version.outputs.version }}
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mystream-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: MyStream v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*
